<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Photographs, 2023–2026</title>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap"
    >
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="wrap">
        <nav>
            <b>Photographs</b>
            <div class="filters" id="filters"></div>
        </nav>

        <section class="intro">
            <h1>Places I keep <i>going back to</i></h1>
            <p>
                A few years of pictures, mostly taken early in the morning.
                I wrote a line under each one so I remember why it's here.
            </p>
        </section>

        <div class="cols" id="grid"></div>

        <footer>
            <span>2023–2026</span>
            <span>Arrow keys work in the viewer</span>
        </footer>
    </div>

    <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
        <div class="top">
            <span id="cn"></span>
            <button id="cl" type="button">Close</button>
        </div>

        <div class="view" id="view"></div>

        <div class="bot">
            <div>
                <h2 id="ct"></h2>
                <p id="cc"></p>
            </div>

            <div class="nav2">
                <button id="pv" type="button">Previous</button>
                <button id="nx" type="button">Next</button>
            </div>
        </div>
    </div>
</body>
</html>
